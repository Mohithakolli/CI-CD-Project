name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Prepare artifact
        run: |
          # Create a tarball containing server and the built client
          tar -czf deploy.tar.gz server/ client/dist/

      - name: Copy artifact to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "deploy.tar.gz"
          # Use explicit absolute path to avoid confusion with shell expansion
          target: "/home/${{ secrets.EC2_USER }}/deploy.tar.gz"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e
            mkdir -p ~/deploy-this
            # If a directory accidentally exists at ~/deploy.tar.gz, remove it
            if [ -d ~/deploy.tar.gz ]; then
              echo "Found directory at ~/deploy.tar.gz — removing to allow tar extraction"
              rm -rf ~/deploy.tar.gz
            fi
            # Diagnostic: show what's in the home dir and file type if present
            echo "Listing home directory before extraction:"; ls -la ~/
            if [ -f ~/deploy.tar.gz ]; then
              echo "deploy.tar.gz exists; file info:"; file ~/deploy.tar.gz || true
            else
              echo "Error: ~/deploy.tar.gz not found on remote. Aborting and listing home dir for debugging.";
              ls -la ~/
              exit 1
            fi
            tar -xzf ~/deploy.tar.gz -C ~/deploy-this

            # Install Node if missing (uses NodeSource for Node 18 LTS)
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get update
              sudo apt-get install -y nodejs
            fi

            # Ensure pm2 is available
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            # No nginx: the Express server will serve the built client from client/dist
            echo "No nginx configuration required — serving static from server via Express"

            # Install server dependencies and start with pm2
            cd ~/deploy-this/server
            npm ci --production
            if pm2 describe deploy-this >/dev/null 2>&1; then
              pm2 restart deploy-this
            else
              pm2 start index.js --name deploy-this
            fi
            pm2 save
            sudo pm2 startup systemd -u $USER --hp $HOME || true
